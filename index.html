<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <title>Trigger Happy Loading</title>
        <link rel="stylesheet" href="./style.css" />
        <script src="./config.js"></script>
        <script src="./app.js" defer></script>
    </head>
    <body>
        <main id="screen">
            <img id="fallback-image" alt="" draggable="false" />
            <video id="local-video" loop playsinline preload="none"></video>
            <div id="youtube-wrap" aria-hidden="true">
                <div id="youtube-player"></div>
            </div>

            <section id="loading-card" aria-label="Loading">
                <h1 id="title">Welcome to Trigger Happy!</h1>
                <p id="subtitle">Loading server assets</p>
                <div id="progress-track">
                    <div id="progress-fill"></div>
                </div>
                <p id="status">Starting loading screen</p>
                <p id="media-status" role="status"></p>
            </section>

            <nav id="controls" aria-label="Loading screen controls">
                <button id="prev-video" type="button" title="Previous video" aria-label="Previous video">
                    <span aria-hidden="true">&lt;</span>
                </button>
                <button id="sound-toggle" type="button" title="Sound" aria-label="Sound">
                    <span id="sound-icon" aria-hidden="true">VOL</span>
                </button>
                <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume" />
                <button id="next-video" type="button" title="Next video" aria-label="Next video">
                    <span aria-hidden="true">&gt;</span>
                </button>
            </nav>

            <audio id="music" loop preload="none"></audio>
        </main>
    </body>
</html>
